<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Instagram Discovery Inbox | hr-sns-auto</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container">
    <nav><a th:href="@{/candidates}">후보 관리</a></nav>

    <header class="page-header">
        <div>
            <p class="eyebrow">Instagram-native media discovery</p>
            <h1>Discovery Inbox</h1>
            <p class="muted">공식 Meta API에서 hashtag별 최근 게시물을 가져와 운영자가 원문을 검토한다.</p>
        </div>
        <form th:action="@{/discovery/sync}" method="post">
            <button type="submit">최근 게시물 가져오기</button>
        </form>
    </header>

    <p class="flash" th:if="${message}" th:text="${message}"></p>
    <p class="flash error" th:if="${error}" th:text="${error}"></p>

    <section class="panel" th:if="${syncResult}">
        <h2>마지막 sync 결과</h2>
        <p class="sync-summary"
           th:text="|성공 ${syncResult.successfulCount}개 · 실패 ${syncResult.failedCount}개 · 조회 ${syncResult.fetchedCount}건 · 신규 저장 ${syncResult.createdCount}건|"></p>
        <div class="sync-result-list" th:unless="${#lists.isEmpty(syncResult.hashtagResults)}">
            <div class="sync-result" th:each="result : ${syncResult.hashtagResults}"
                 th:attr="data-success=${result.successful}">
                <strong th:text="|#${result.keyword}|"></strong>
                <span th:if="${result.successful}"
                      th:text="|조회 ${result.fetchedCount}건, 신규 ${result.createdCount}건|"></span>
                <span th:unless="${result.successful}" th:text="${result.errorMessage}"></span>
            </div>
        </div>
        <p class="empty" th:if="${#lists.isEmpty(syncResult.hashtagResults)}">
            활성화된 hashtag가 없어 호출하지 않음
        </p>
    </section>

    <section class="panel">
        <div class="section-heading">
            <div>
                <h2>Discovery hashtag</h2>
                <p class="muted">비활성화해도 기존 게시물의 발견 source는 유지된다.</p>
            </div>
            <form class="inline-form" th:action="@{/discovery/hashtags}" th:object="${hashtagForm}" method="post">
                <label class="visually-hidden" for="hashtag-keyword">새 hashtag</label>
                <input id="hashtag-keyword" type="text" th:field="*{keyword}"
                       placeholder="#피부과" autocomplete="off">
                <button type="submit">추가</button>
                <span class="field-error full-width" th:if="${#fields.hasErrors('keyword')}"
                      th:errors="*{keyword}"></span>
            </form>
        </div>

        <div class="hashtag-list">
            <div class="hashtag-row" th:each="hashtag : ${hashtags}"
                 th:attr="data-enabled=${hashtag.enabled}">
                <span class="hashtag-chip" th:text="|#${hashtag.keyword}|"></span>
                <span class="muted" th:text="${hashtag.enabled ? '활성' : '비활성'}"></span>
                <form th:if="${hashtag.enabled}"
                      th:action="@{/discovery/hashtags/{id}/disable(id=${hashtag.id})}" method="post">
                    <button type="submit" class="secondary compact">비활성화</button>
                </form>
                <form th:unless="${hashtag.enabled}"
                      th:action="@{/discovery/hashtags/{id}/enable(id=${hashtag.id})}" method="post">
                    <button type="submit" class="secondary compact">재활성화</button>
                </form>
            </div>
        </div>
    </section>

    <section class="inbox-overview">
        <div class="count-card"><strong th:text="${counts.newCount}"></strong><span>NEW</span></div>
        <div class="count-card"><strong th:text="${counts.openedCount}"></strong><span>OPENED</span></div>
        <div class="count-card"><strong th:text="${counts.dismissedCount}"></strong><span>DISMISSED</span></div>
    </section>

    <nav class="filter-nav" aria-label="검토 상태 필터">
        <a th:href="@{/discovery}" th:attr="aria-current=${selectedStatus == 'ALL' ? 'page' : null}">전체</a>
        <a th:each="status : ${reviewStatuses}"
           th:href="@{/discovery(status=${status})}"
           th:text="${status}"
           th:attr="aria-current=${selectedStatus == status.name() ? 'page' : null}"></a>
    </nav>

    <section class="discovery-list">
        <article class="panel discovery-item" th:each="item : ${items}"
                 th:attr="data-status=${item.reviewStatus}">
            <div class="discovery-item-heading">
                <div class="item-badges">
                    <span class="status" th:attr="data-status=${item.reviewStatus}"
                          th:text="${item.reviewStatus}"></span>
                    <span class="media-type" th:text="${item.mediaType}"></span>
                </div>
                <time class="muted" th:datetime="${item.publishedAt}" th:text="${item.publishedAt}"></time>
            </div>

            <p class="caption" th:text="${item.captionExcerpt ?: '캡션 없음'}"></p>

            <div class="discovery-meta">
                <span>발견 hashtag</span>
                <span class="hashtag-chip small" th:each="hashtag : ${item.hashtags}"
                      th:text="|#${hashtag.keyword}|"></span>
            </div>

            <div class="actions">
                <a class="button" th:href="@{/discovery/items/{id}/open(id=${item.id})}"
                   target="_blank" rel="noopener noreferrer">Instagram에서 열기</a>
                <form th:if="${item.reviewStatus.name() != 'DISMISSED'}"
                      th:action="@{/discovery/items/{id}/dismiss(id=${item.id})}" method="post">
                    <button type="submit" class="secondary">관심 없음</button>
                </form>
            </div>
        </article>

        <div class="panel empty" th:if="${#lists.isEmpty(items)}">
            이 필터에 표시할 Discovery item이 없다.
        </div>
    </section>
</main>
</body>
</html>
