spring.application.name=hr-sns-auto

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hr_sns_auto}
spring.datasource.username=${DB_USERNAME:hr_sns_auto}
spring.datasource.password=${DB_PASSWORD:hr_sns_auto_dev}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Meta Instagram Graph API (optional at startup; required only for manual discovery sync)
meta.instagram.access-token=${META_ACCESS_TOKEN:}
meta.instagram.api-version=${META_GRAPH_API_VERSION:}
meta.instagram.ig-user-id=${META_IG_USER_ID:}

# Operator-triggered local Instagram browser enrichment (disabled by default)
instagram.browser.automation-enabled=${INSTAGRAM_BROWSER_AUTOMATION_ENABLED:false}
instagram.browser.user-data-dir=${INSTAGRAM_BROWSER_USER_DATA_DIR:.local/instagram-browser-profile}
instagram.browser.headless=${INSTAGRAM_BROWSER_HEADLESS:false}
instagram.browser.batch-size=${INSTAGRAM_BROWSER_BATCH_SIZE:10}
